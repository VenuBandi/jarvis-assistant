# Jarvis model providers. Add a provider or model here; no code change needed for a new model on a known type.
# Types: anthropic (Messages API), openai_compat (/v1/chat/completions), ollama (/api/chat), mock (tests).
# Capabilities are what we EXPECT; "validated" in the app means a live ping succeeded.
# Secrets: never put keys here. 'secret' = name in macOS Keychain (service "jarvis"); 'env' = env var fallback;
# 'secret_file' = a mode-600 file read at call time.
active: local-qwen

providers:
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    secret: anthropic_api_key
    env: ANTHROPIC_API_KEY
  omniroute:
    type: openai_compat
    base_url: http://127.0.0.1:20128/v1
    secret_file: ~/.config/jarvis/omniroute_key
  nvidia:   # NVIDIA build.nvidia.com free dev access, direct (not via OmniRoute). Director 2026-10-21.
    type: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    secret_file: ~/.config/jarvis/keys/nvidia
  mistral:  # Mistral La Plateforme free "Experiment" tier, direct (not via OmniRoute). Director 2026-10-21.
    type: openai_compat
    base_url: https://api.mistral.ai/v1
    secret_file: ~/.config/jarvis/keys/mistral
  ollama:
    type: ollama
    base_url: http://127.0.0.1:11434
  mock:
    type: mock

models:
  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    capabilities: [tools, vision, streaming]
  claude-opus:
    provider: anthropic
    model: claude-opus-5-5
    label: Claude Opus 5.5
    capabilities: [tools, vision, streaming]
  claude-haiku:
    provider: anthropic
    model: claude-haiku-5-5
    label: Claude Haiku 5.5
    capabilities: [tools, vision, streaming]
  claude-fable:
    provider: anthropic
    model: claude-fable-5-1
    label: Claude Fable 5.1
    capabilities: [tools, vision, streaming]
  gemini-flash:
    provider: omniroute
    model: antigravity/gemini-3-flash
    label: Gemini 3 Flash (via OmniRoute)
    capabilities: [tools]
  # NVIDIA direct (free dev tier). Ping 2026-10-21 (fixed one-line prompt): these 5 answered OK.
  # Timed out at 120 s: deepseek-v4.1-flash, glm-5.3-flash. 503 overloaded: laguna-xs-2.1. Gemma-4-31b OK but 72 s.
  nv-nemotron-ultra:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    label: Nemotron 3 Ultra 550B (NVIDIA)
    capabilities: []
  nv-nemotron-lightning:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    label: Nemotron 3.5 Lightning 30B (NVIDIA)
    capabilities: []
  nv-glm:
    provider: nvidia
    model: z-ai/glm-5.3
    label: GLM 5.3 (NVIDIA)
    capabilities: []
  nv-gpt-oss:
    provider: nvidia
    model: openai/gpt-oss-20b
    label: gpt-oss 20B (NVIDIA)
    capabilities: []
  nv-glimmer:
    provider: nvidia
    model: meta/muse-glimmer-30b
    label: Muse Glimmer 30B (NVIDIA)
    capabilities: []
  # Mistral direct (free Experiment tier). Ping 2026-10-21: codestral + ministral-8b OK;
  # mistral-medium/small and magistral-medium return 429 on every call (tier limit, not added yet).
  mi-codestral:
    provider: mistral
    model: codestral-latest
    label: Codestral (Mistral)
    capabilities: []
  mi-ministral:
    provider: mistral
    model: ministral-8b-latest
    label: Ministral 8B (Mistral)
    capabilities: []
  local-qwen:
    provider: ollama
    model: qwen3-8b-32k
    label: Qwen3 8B (local Ollama)
    capabilities: [tools]
  mock:
    provider: mock
    model: mock-1
    label: Mock (tests only)
    capabilities: [tools]

# Spoken names → model keys. "Fable 5" is a user alias resolved to claude-fable (validated only with a real key).
aliases:
  sonnet: claude-sonnet
  claude sonnet: claude-sonnet
  opus: claude-opus
  claude opus: claude-opus
  haiku: claude-haiku
  claude haiku: claude-haiku
  fable: claude-fable
  fable 5: claude-fable
  claude fable: claude-fable
  gemini: gemini-flash
  gemini flash: gemini-flash
  nemotron: nv-nemotron-ultra
  nemotron ultra: nv-nemotron-ultra
  nemotron lightning: nv-nemotron-lightning
  glm: nv-glm
  gpt oss: nv-gpt-oss
  glimmer: nv-glimmer
  codestral: mi-codestral
  ministral: mi-ministral
  local: local-qwen
  qwen: local-qwen
  local model: local-qwen
